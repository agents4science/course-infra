# LiteLLM gateway configuration — two lanes, course defaults.
# Pin model identifiers to current offerings in sprint 1.

model_list:
  # ---- commercial frontier lane (default for labs/projects) ----
  - model_name: frontier-general
    litellm_params:
      model: openai/gpt-4o            # placeholder; pin in sprint 1
      api_key: os.environ/OPENAI_API_KEY
  - model_name: frontier-reasoning
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- Argonne lane: ALCF Inference Endpoints (open models on lab hardware) ----
  # OpenAI-compatible; auth = Globus access tokens that EXPIRE (hours).
  # Run scripts/refresh_alcf_token.py on a cron (every 4h) to keep the lane live.
  # Served models change; see https://docs.alcf.anl.gov/services/inference-endpoints/
  # NOTE: Argonne-lane models are NOT defined here. Globus tokens expire and
  # config-file models cannot be updated via the admin API, so the lane is
  # DB-managed: scripts/refresh_alcf_token.py creates and rotates the
  # deployments. Catalog: GET /resource_server/list-endpoints; running jobs:
  # /resource_server/sophia/jobs (non-running models cold-start via PBS).

  # ---- simulation lane: mock model for keyless infra testing ----
  - model_name: sim-mock
    litellm_params:
      model: openai/mock-model
      api_key: "sk-mock"
      mock_response: "SIMULATED RESPONSE: plan step completed; proceeding to next action."

litellm_settings:
  # Trace capture (I4): OpenTelemetry -> Phoenix (ADR-3)
  callbacks: ["otel"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Per-student virtual keys are created by scripts/provision_students.py
  # with a per-quarter max_budget (hard cap) — the I2 enforcement primitive.
